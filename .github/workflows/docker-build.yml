name: Build and Push Docker Image

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Безопасное извлечение метаданных силами самого GitHub
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Магия функций GitHub Actions: 
          # "github.repository_owner" берет ТОЛЬКО ваш ник (без чужой организации)
          # "github.event.repository.name" берет ТОЛЬКО название репозитория
          # Функция "format" собирает их вместе, а "toLower" делает ВСЕ буквы маленькими
          images: |
            ghcr.io/${{ toLower(format('{0}/{1}', github.repository_owner, github.event.repository.name)) }}
          tags: |
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
